name: Bug
description: Something in Divvy behaves incorrectly.
title: "bug: <short summary>"
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The incorrect behavior, with steps or the input that triggers it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Command(s), test or page steps that surface it.
      render: shell
    validations:
      required: false
