name: deploy

on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  staging:
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci && npm run build
      # A failed migration fails this step, so the deploy below never runs.
      - run: npx wrangler d1 migrations apply divvy-staging --env staging --remote
      - run: npx wrangler deploy --env staging
      - run: curl -fsS --retry 6 --retry-delay 5 --retry-all-errors https://divvy-staging.hugohhkwok.workers.dev/ -o /dev/null
